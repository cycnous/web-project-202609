<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH8 From - CRUD</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/myall.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">CRUD練習</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="20261110 - CH8 From - CRUD - C.html">產品建檔</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">產品列表</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header display-6 text-center">產品列表</div>
                    <div class="card-body">
                        <table class="table table-bordered table-striped table-hover table-sm table-rwd">
                            <thead class="table-primary">
                                <tr>
                                    <th width="15%">商品名稱</th>
                                    <th width="15%">商品分類</th>
                                    <th width="10%">商品價格</th>
                                    <th width="10%">庫存數量</th>
                                    <th width="35%">商品備註</th>
                                    <th width="15%">#</th>
                                </tr>
                            </thead>
                            <tbody id='mytbody'>
                                <tr>
                                    <td data-th="商品名稱"><span>xxx</span></td>
                                    <td data-th="商品分類"><span>xxx</span></td>
                                    <td data-th="商品價格"><span>xxx</span></td>
                                    <td data-th="庫存數量"><span>xxx</span></td>
                                    <td data-th="商品備註"><span>xxx</span></td>
                                    <td data-th='功能'>
                                        <button class="btn btn-warning" data-bs-toggle="modal"
                                            data-bs-target="#updateModal">更新</button>
                                        <button class="btn btn-danger">刪除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- 頁碼 -->
                        <nav aria-label="Page navigation example">
                            <ul class="pagination justify-content-center" id="pageList">
                                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                                <li class="page-item"><a class="page-link" href="#">1</a></li>
                                <li class="page-item"><a class="page-link" href="#">2</a></li>
                                <li class="page-item"><a class="page-link" href="#">3</a></li>
                                <li class="page-item"><a class="page-link" href="#">Next</a></li>
                            </ul>
                        </nav>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="updateModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="updateModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="updateModalLabel">產品更新</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 form-floating">
                        <input type="text" class="form-control form-control-lg" placeholder="" id="pname" disabled
                            value="紅茶">
                        <label for="pname" class="form-label">商品名稱 (2-6個字)</label>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">價格 (1-100)</label>
                        <input type="number" class="form-control" id="price" min="1" max="100" value="50">
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">不符合規定</div>
                    </div>
                    <div class="mb-3">
                        <label for="num" class="form-label">數量 <span id="cnt">50</span>個</label>
                        <input type="range" class="form-range" id='num' min="1" max="100" step="1" value="50">
                        <div class="d-flex justify-content-between">
                            <span>1</span><span>100</span>
                        </div>
                    </div>
                    <select name="" id="category" class="form-select mb-3">
                        <option value="" class="text-center" disabled>---請選擇商品分類---</option>
                        <option value="零食" disabled>零食</option>
                        <option value="乳製品" disabled>乳製品</option>
                        <option value="飲料" disabled selected>飲料</option>
                        <option value="食品" disabled>食品</option>
                    </select>
                    <div class="mb-3">
                        <label for="remark" class="form-label">備註</label>
                        <textarea id="remark" class="form-control" placeholder="商品需注意的事項(2-10個字)"
                            disabled>需冷藏</textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="updateModal-btn-update">確認更新</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const pageSize = 5;
        let page = 1;
        let productData = [];   // 儲存API取得的所有資料
        let flag_price = true;
        let uid = '';           // 紀錄update的id

        $(function () {
            // 取得資料 GET API
            $.ajax({
                type: 'GET',
                url: 'http://localhost:3000/product',
                dataType: 'json',
                success: showdata,
                error: function () {
                    Swal.fire({
                        title: "讀取失敗",
                        text: "無法連結至 JSON Server (http://localhost:3000/product)",
                        icon: "error"
                    });
                }
            });

            // 監聽點擊頁碼
            // 監聽頁碼列表pageList 的頁碼連結.page-link (因為class所以要加.)
            // 為了避免資料還沒抓完就開始監聽, 所以要多設定.page-link
            // data('page') 是在抓data-page
            $('#pageList').on('click', '.page-link', function () {
                console.log($(this).data('page'));
                page = Number($(this).data('page'));    // 數字一律都要記得轉換成Number, 避免出錯

                showdata(productData);
            })

            // 監聽更新按鈕
            // btn-update 設定在class是因為有多個重複元件, 基本上id不可重複
            $('#mytbody').on('click', '.btn-update', function () {
                console.log($(this).data('id'));
                const id = $(this).data('id');
                uid = id;

                // 傳遞至後端API, 取得資料
                $.ajax({
                    type: 'GET',
                    url: 'http://localhost:3000/product/' + id,
                    dataType: 'json',
                    success: showUpdateData,
                    error: function () {
                        Swal.fire({
                            title: "讀取失敗",
                            text: "無法連結至 JSON Server (http://localhost:3000/product)",
                            icon: "error"
                        });
                    }
                });
            })

            // 監聽更新modal 產品價格
            $('#price').on('change', function () {
                const price = Number($(this).val());
                if (price >= 1 && price <= 100) {
                    $(this).removeClass('is-invalid')
                    $(this).addClass('is-valid')
                    flag_price = true;
                } else {
                    $(this).removeClass('is-valid')
                    $(this).addClass('is-invalid')
                    flag_price = false;
                }
            })

            // 監聽更新modal 產品數量
            $('#num').on('input', function () {
                $('#cnt').text($(this).val());
            });

            // 監聽更新modal的更新按鈕
            $('#updateModal-btn-update').on('click', function () {
                if (!flag_price) {
                    Swal.fire({
                        title: '更新失敗',
                        text: '價格欄位錯誤',
                        icon: 'error'
                    })
                    return;
                }

                // 取得表單資料
                const price = Number($('#price').val());
                const num = Number($('#num').val());

                // 轉換成json格式
                const jsonData = {
                    price: price,
                    num: num
                }
                console.log(JSON.stringify(jsonData));

                // 傳遞至後端更新, PATCH: 更新特定欄位
                // data: 要傳的資料
                // 資料有中文時要加 contentType: 'application/json'
                $.ajax({
                    type: 'PATCH',
                    url: 'http://localhost:3000/product/' + uid,
                    dataType: 'json',
                    data: JSON.stringify(jsonData),
                    contentType: 'application/json',
                    success: function (data) {
                        console.log('patch success: ', data);

                        // 關閉modal
                        bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();

                        Swal.fire({
                            title: "更新成功",
                            text: "產品資料已更新",
                            icon: "success"
                        });

                        // 重新取得產品列表
                        $.ajax({
                            type: 'GET',
                            url: 'http://localhost:3000/product',
                            dataType: 'json',
                            success: showdata,
                            error: function () {
                                Swal.fire({
                                    title: "讀取失敗",
                                    text: "無法連結至 JSON Server (http://localhost:3000/product)",
                                    icon: "error"
                                });
                            }
                        });
                    },
                    error: function () {
                        Swal.fire({
                            title: "更新失敗",
                            text: "無法連結至 JSON Server (http://localhost:3000/product)",
                            icon: "error"
                        });
                    }
                });
            });

            // 監聽刪除按鈕 btn-delete
            $('#mytbody').on('click', '.btn-delete', function () {
                console.log($(this).data('id'));
                const did = $(this).data('id')

                // 詢問確認是否刪除
                Swal.fire({
                    title: "確認刪除嗎?",
                    showDenyButton: true,
                    showCancelButton: false,
                    confirmButtonText: "確認",
                    denyButtonText: `取消`,
                    icon: 'question'
                }).then((result) => {
                    /* Read more about isConfirmed, isDenied below */
                    if (result.isConfirmed) {
                        // 傳送did 至後端API執行刪除
                        $.ajax({
                            type: 'DELETE',
                            url: 'http://localhost:3000/product/' + did,
                            dataType: 'json',
                            success: function (data) {
                                console.log(data);

                                Swal.fire({
                                    title: "刪除成功",
                                    text: "產品資料已刪除",
                                    icon: "success"
                                });

                                // 重新取得產品列表
                                $.ajax({
                                    type: 'GET',
                                    url: 'http://localhost:3000/product',
                                    dataType: 'json',
                                    success: function(data){
                                        // 避免刪除後頁數減少, 導致頁碼錯誤
                                        totalPage = Math.ceil(data.length / pageSize);
                                        if(page > totalPage){
                                            // 從 1 跟 totalPage 中取最大值, 避免刪到沒資料後, totalPage=0
                                            page = Math.max(1, totalPage);
                                        }
                                        showdata(data);
                                    },
                                    error: function () {
                                        Swal.fire({
                                            title: "讀取失敗",
                                            text: "無法連結至 JSON Server (http://localhost:3000/product)",
                                            icon: "error"
                                        });
                                    }
                                });

                            },
                            error: function () {
                                Swal.fire({
                                    title: "刪除失敗",
                                    text: "無法刪除產品資料",
                                    icon: "error"
                                });
                            }

                        });
                    }
                    else if (result.isDenied) Swal.fire("放棄刪除", "", "info");
                });
            });
        });

        function showdata(data) {
            console.log(data);
            productData = data;     // 因為點擊頁碼要重新顯示資料, 所以要新增一個公有變數存所有資料

            // 分頁
            const pageData = pagination(data, pageSize, page);

            $('#mytbody').empty();
            pageData.forEach(function (item) {
                let strHTML = `<tr>
                                    <td data-th="商品名稱"><span>${item.name}</span></td>
                                    <td data-th="商品分類"><span>${item.category}</span></td>
                                    <td data-th="商品價格"><span>${item.price}</span></td>
                                    <td data-th="庫存數量"><span>${item.num}</span></td>
                                    <td data-th="商品備註"><span>${item.remark}</span></td>
                                    <td data-th='功能'>
                                        <button class="btn btn-update btn-warning" data-bs-toggle="modal" data-bs-target="#updateModal" data-id='${item.id}'>更新</button>
                                        <button class="btn btn-delete btn-danger" data-id='${item.id}'>刪除</button>
                                    </td>
                                </tr>`;
                $('#mytbody').append(strHTML);
            });

            // 產生頁碼
            const totalPage = Math.ceil(data.length / pageSize);
            $('#pageList').empty();
            if (page > 1) {
                $('#pageList').append(`<li class="page-item"><a class="page-link" href="#" data-page=${page - 1}>Previous</a></li>`);
            }
            for (let i = 1; i <= totalPage; i++) {
                // 三元運算子
                let active = (i === page) ? 'active' : '';
                let strHTML = `<li class="page-item ${active}"><a class="page-link" href="#" data-page='${i}'>${i}</a></li>`
                $('#pageList').append(strHTML);
            }
            if (page < totalPage) {
                $('#pageList').append(`<li class="page-item"><a class="page-link" href="#" data-page=${page + 1}>Next</a></li>`);
            }
        }

        function showUpdateData(data) {
            console.log(data);

            // 將資料放進updateModal
            $('#pname').val(data.name);
            $('#category').val(data.category);
            $('#price').val(data.price);
            $('#cnt').text(data.num);
            $('#num').val(data.num);
            $('#remark').val(data.remark);
        }

        function pagination(data, pageSize, page) {
            const start = (page - 1) * pageSize;
            const end = start + pageSize;

            return data.slice(start, end);
        }
    </script>

</body>

</html>
